<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenLayers Test</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.11.0/ol.css">
  <style>
    #map {
      width: 100%;
      height: 400px;
    }
    #records {
      max-height: 300px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <h1>OpenLayers Test</h1>
  <p id="status">Checking OpenLayers...</p>
  <div id="map"></div>
  <p id="data-status">Loading GeoParquet data...</p>

  <label for="county">County:</label>
  <select id="county"></select>
  <p id="record-count"></p>
  <pre id="records"></pre>

  <script src="https://cdn.jsdelivr.net/npm/ol@10.11.0/dist/ol.js"></script>
  <script type="module">
    const status = document.getElementById("status");
    const dataStatus = document.getElementById("data-status");
    const countySelect = document.getElementById("county");
    const recordCount = document.getElementById("record-count");
    const records = document.getElementById("records");

    try {
      const map = new ol.Map({
        target: "map",
        layers: [
          new ol.layer.Tile({
            source: new ol.source.OSM(),
          }),
        ],
        view: new ol.View({
          center: ol.proj.fromLonLat([-79.5, 35.5]),
          zoom: 6,
        }),
      });

      status.textContent = "OpenLayers loaded successfully.";

      const { parquetReadObjects } = await import(
        "https://esm.sh/hyparquet@1.30.0"
      );
      const { compressors } = await import(
        "https://esm.sh/hyparquet-compressors@1.1.1"
      );

      const response = await fetch("./NC_counties_temperatures.geoparquet");

      if (!response.ok) {
        throw new Error("Could not load GeoParquet file.");
      }

      const rows = await parquetReadObjects({
        file: await response.arrayBuffer(),
        columns: ["county_fips", "date", "temperature_f", "geometry"],
        compressors,
      });

      if (!rows.length) {
        throw new Error("No records found.");
      }

      const firstDate = String(rows[0].date);
      const countyRows = rows.filter((row) =>
        String(row.date) === firstDate && row.geometry
      );

      const geojson = {
        type: "FeatureCollection",
        features: countyRows.map((row) => ({
          type: "Feature",
          geometry: row.geometry,
          properties: {
            county_fips: row.county_fips,
          },
        })),
      };

      const vectorSource = new ol.source.Vector({
        features: new ol.format.GeoJSON().readFeatures(geojson, {
          dataProjection: "EPSG:4326",
          featureProjection: "EPSG:3857",
        }),
      });

      map.addLayer(new ol.layer.Vector({
        source: vectorSource,
      }));

      map.getView().fit(vectorSource.getExtent(), {
        padding: [20, 20, 20, 20],
        maxZoom: 8,
      });

      const countyCodes = [...new Set(
        rows.map((row) => String(row.county_fips))
      )].sort();

      countyCodes.forEach((code) => {
        const option = document.createElement("option");
        option.value = code;
        option.textContent = code;
        countySelect.appendChild(option);
      });

      function showRecords() {
        const selectedRows = rows.filter((row) =>
          String(row.county_fips) === countySelect.value
        );

        recordCount.textContent =
          `${selectedRows.length} records for county ${countySelect.value}`;

        records.textContent = selectedRows.map((row) =>
          `${row.date} | ${row.temperature_f}°F`
        ).join("\n");
      }

      countySelect.addEventListener("change", showRecords);
      showRecords();

      dataStatus.textContent =
        `Loaded ${rows.length} records. Showing ${countyRows.length} county shapes for ${firstDate}.`;

    } catch (error) {
      dataStatus.textContent = error.message;
      console.error(error);
    }
  </script>
</body>
</html>
