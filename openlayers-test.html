<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenLayers Test</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.11.0/ol.css">
  <style>
    #map {
      width: 100%;
      height: 400px;
    }
  </style>
</head>
<body>
  <h1>OpenLayers Test</h1>
  <p id="status">Checking OpenLayers...</p>
  <div id="map"></div>
  <p id="data-status">Loading GeoParquet data...</p>

  <script src="https://cdn.jsdelivr.net/npm/ol@10.11.0/dist/ol.js"></script>
  <script>
    const status = document.getElementById("status");

    if (typeof ol !== "undefined") {
      status.textContent = "OpenLayers loaded successfully.";

      new ol.Map({
        target: "map",
        layers: [
          new ol.layer.Tile({
            source: new ol.source.OSM(),
          }),
        ],
        view: new ol.View({
          center: ol.proj.fromLonLat([-79.5, 35.5]),
          zoom: 6,
        }),
      });
    } else {
      status.textContent = "OpenLayers could not be loaded.";
    }
  </script>

  <script type="module">
    const dataStatus = document.getElementById("data-status");

    try {
      const { parquetReadObjects } = await import(
        "https://esm.sh/hyparquet@1.30.0"
      );
      const { compressors } = await import(
        "https://esm.sh/hyparquet-compressors@1.1.1"
      );

      const response = await fetch("./NC_counties_temperatures.geoparquet");

      if (!response.ok) {
        throw new Error("Could not load GeoParquet file.");
      }

      const rows = await parquetReadObjects({
        file: await response.arrayBuffer(),
        columns: ["county_fips", "date", "temperature_f", "geometry"],
        compressors,
      });

      if (!rows.length) {
        throw new Error("No records found.");
      }

      const firstDate = String(rows[0].date);
      const countyRows = rows.filter((row) =>
        String(row.date) === firstDate && row.geometry
      );

      dataStatus.textContent =
        `Loaded ${rows.length} records. ${countyRows.length} county records for ${firstDate}.`;

    } catch (error) {
      dataStatus.textContent = error.message;
      console.error(error);
    }
  </script>
</body>
</html>
